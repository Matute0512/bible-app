<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <radialGradient id="featureBg" cx="25%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2A2440"/>
      <stop offset="60%" stop-color="#181426"/>
      <stop offset="100%" stop-color="#0D0A14"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DFD3"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#featureBg)"/>

  <!-- Sacred Geometry Accents -->
  <circle cx="150" cy="150" r="300" fill="none" stroke="#D4A017" stroke-width="1.2" stroke-opacity="0.12"/>
  <circle cx="150" cy="150" r="220" fill="none" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="8 8" stroke-opacity="0.16"/>

  <!-- Left Content -->
  <g transform="translate(64, 80)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#D4A017" fill-opacity="0.15" stroke="#D4A017" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="110" y="21" fill="#F5C542" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">✦ UN CAPÍTULO AL DÍA</text>

    <!-- App Title -->
    <text x="0" y="105" fill="url(#titleGrad)" font-family="'Lora', Georgia, serif" font-size="54" font-weight="bold">Lectura Bíblica</text>

    <!-- Tagline -->
    <text x="0" y="155" fill="#C8BFB0" font-family="'Inter', sans-serif" font-size="18">Lectura inmersiva inspirada en códices antiguos.</text>
    <text x="0" y="182" fill="#C8BFB0" font-family="'Inter', sans-serif" font-size="18">Avanzá a tu propio ritmo por las Sagradas Escrituras.</text>

    <!-- Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="80" y="24" fill="#EDE8DE" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">✓ 100% Desconectada</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="180" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="262" y="24" fill="#EDE8DE" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">✓ Sin Anuncios ni Cuentas</text>

      <!-- Badge 3 -->
      <rect x="364" y="0" width="150" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="439" y="24" fill="#EDE8DE" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">✓ Privacidad Total</text>
    </g>
  </g>

  <!-- Right Graphic: Codex Emblem Illustration -->
  <g transform="translate(680, 110) scale(1.15)" filter="url(#fShadow)">
    <circle cx="140" cy="110" r="160" fill="#D4A017" fill-opacity="0.06" stroke="#D4A017" stroke-width="1.5" stroke-opacity="0.2"/>
    <circle cx="140" cy="110" r="130" fill="none" stroke="#D4A017" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.25"/>

    <!-- Open Codex -->
    <path d="M140 25 C100 15 35 20 15 35 L15 165 C35 150 100 145 140 155 Z" fill="#9E740B"/>
    <path d="M140 25 C180 15 245 20 265 35 L265 165 C245 150 180 145 140 155 Z" fill="#B8860B"/>
    <path d="M140 22 C102 12 38 18 20 32 L20 160 C38 146 102 140 140 150 Z" fill="#FDFBF7"/>
    <path d="M140 22 C178 12 242 18 260 32 L260 160 C242 146 178 140 140 150 Z" fill="#FAF6EE"/>

    <!-- Text Lines -->
    <line x1="45" y1="60" x2="120" y2="57" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="80" x2="120" y2="77" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="120" y2="97" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="120" x2="95" y2="118" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>

    <line x1="160" y1="57" x2="235" y2="60" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="77" x2="235" y2="80" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="97" x2="235" y2="100" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="117" x2="210" y2="119" stroke="#C4B9A7" stroke-width="3" stroke-linecap="round"/>

    <!-- Gold Ribbon -->
    <polygon points="127,-10 153,-10 153,195 140,212 127,195" fill="url(#goldRibbon)"/>
    <text x="140" y="80" fill="#FFFFFF" font-family="serif" font-size="28" font-weight="bold" text-anchor="middle">✦</text>
  </g>
</svg>
